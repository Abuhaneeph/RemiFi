# Render Blueprint — Remifi HTTP API (backend for web app).
# OpenClaw / Telegram agent: deploy separately on Hostinger VPS (see deploy/DEPLOY.md).
#
# Deploy: connect this repo in Render → New Blueprint → select render.yaml
# Or: New Web Service → Docker → point at this Dockerfile.

services:
  - type: web
    name: remifi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: remifi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: LOG_LEVEL
        value: info
      # ── Set these in the Render dashboard (Secrets) ──
      - key: CELO_RPC_URL
        sync: false
      - key: CELO_CHAIN_ID
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: DEMO_RECIPIENT_ADDRESS
        sync: false
      - key: REMIFI_VAULT_ADDRESS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_AGENT_API_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: AGENT_ID
        sync: false
      - key: THIRDWEB_SECRET_KEY
        sync: false
